<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="cabecalho">
        <div id="options">
            <img src="images/casa_dark.png"  
            alt="Home" class="img-option" id="buttonHome">
            <img src="images/historia_dark.png"

            <img src="images/engrenagem_dark.png"

    <div id="page-home">

                Selecione a opção referente ao problema apresentado em sua máquina
            </div>

                <div class="callOption" id="optionOne">
                    Computador (hardware)
                </div>
                <div class="callOption" id="optionTwo">
                    Software e sistemas
                </div>
                <div class="callOption" id="optionThree">
                    Rede e internet
                </div>
                <div class="callOption" id="optionFour">
                    Impressoras e periféricos
                </div>
                <div class="callOption" id="optionFive">
                    E-mail e comunicação
                </div>
            </div>

            <div id="callboxOption">
                <div id="callOne">
                        <label for="problem">Problema</label>
                        <select id="problem" required>
                            <option value=""></option>
                        </select>
                </div>
                <div id="callTwo">
                        
                </div>
                <div id="callThree">
                        chamar3
                </div>
                <div id="callFour">
                        chamar4
                </div>
                <div id="callFive">

    <div id="page-config">
        
    </div>
